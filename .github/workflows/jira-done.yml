name: Move Jira Issue to Done

on:
  pull_request:
    types: [closed]
    branches:
      - main

jobs:
  move-jira-to-done:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Move Jira issue to Done
        uses: actions/github-script@v7
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        with:
          script: |
            const baseUrl = process.env.JIRA_BASE_URL.replace(/\/$/, "");
            const email = process.env.JIRA_EMAIL;
            const token = process.env.JIRA_API_TOKEN;

            const pr = context.payload.pull_request;
            const textToCheck = `${pr.title} ${pr.head.ref}`;
            const match = textToCheck.match(/[A-Z][A-Z0-9]+-\d+/);

            if (!match) {
              core.setFailed("No Jira issue key found in the PR title or branch name.");
              return;
            }

            const issueKey = match[0];
            const auth = Buffer.from(`${email}:${token}`).toString("base64");

            const headers = {
              Authorization: `Basic ${auth}`,
              Accept: "application/json",
              "Content-Type": "application/json"
            };

            const issueResponse = await fetch(
              `${baseUrl}/rest/api/3/issue/${issueKey}?fields=status`,
              { headers }
            );

            if (!issueResponse.ok) {
              core.setFailed(`Could not retrieve ${issueKey}: ${issueResponse.status}`);
              return;
            }

            const issue = await issueResponse.json();
            const currentStatus = issue.fields.status;

            if (
              currentStatus.name.toLowerCase() === "done" ||
              currentStatus.statusCategory.key === "done"
            ) {
              core.info(`${issueKey} is already Done.`);
              return;
            }

            const transitionsResponse = await fetch(
              `${baseUrl}/rest/api/3/issue/${issueKey}/transitions`,
              { headers }
            );

            if (!transitionsResponse.ok) {
              core.setFailed(`Could not retrieve transitions: ${transitionsResponse.status}`);
              return;
            }

            const data = await transitionsResponse.json();

            const transition =
              data.transitions.find(t => t.to.name.toLowerCase() === "done") ||
              data.transitions.find(t => t.to.statusCategory.key === "done");

            if (!transition) {
              core.setFailed("No available transition leads to Done for this issue.");
              return;
            }

            const response = await fetch(
              `${baseUrl}/rest/api/3/issue/${issueKey}/transitions`,
              {
                method: "POST",
                headers,
                body: JSON.stringify({
                  transition: { id: transition.id }
                })
              }
            );

            if (!response.ok) {
              core.setFailed(`Could not move ${issueKey} to Done: ${response.status} ${await response.text()}`);
              return;
            }

            core.info(`${issueKey} successfully moved to Done.`);
